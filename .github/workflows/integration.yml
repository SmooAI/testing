name: Integration Tests

on:
    workflow_dispatch:
    schedule:
        # Run daily at 6am UTC
        - cron: '0 6 * * *'

env:
    CI: true
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    integration:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            - name: Locate pnpm store
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install

            - name: Build
              run: pnpm build

            - name: Run integration tests
              run: pnpm test:integration
              env:
                  SMOOAI_CLIENT_ID: ${{ secrets.E2E_CLIENT_ID }}
                  SMOOAI_CLIENT_SECRET: ${{ secrets.E2E_CLIENT_SECRET }}
                  SMOOAI_ORG_ID: ${{ secrets.E2E_ORG_ID }}
                  SMOOAI_API_URL: ${{ secrets.E2E_BASE_URL }}
                  SMOOAI_AUTH_URL: ${{ secrets.E2E_AUTH_URL }}
